name: FleetOps - Notifikasi Telegram Otomatis

# Jalan tiap jam (menit ke-0, waktu UTC) SELAMA 24 JAM PENUH, tanpa perlu ada
# siapa pun yang membuka aplikasi FleetOps di HP/komputer. Bisa juga dites
# manual lewat tombol "Run workflow" di tab Actions (workflow_dispatch).
#
# Catatan: GitHub otomatis MENONAKTIFKAN cron schedule kalau repo ini tidak
# ada aktivitas (commit) sama sekali selama 60 hari -- kalau itu terjadi,
# tinggal buka tab Actions -> workflow ini -> "Enable workflow" untuk
# mengaktifkan lagi. Ini batasan bawaan GitHub, bukan sesuatu yang bisa
# dihindari dari sisi workflow ini.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

# Wajib "write" supaya job di bawah bisa commit balik file notif-state.json
# (penanda anti-spam supaya alert yang sama tidak dikirim ulang tiap jam).
permissions:
  contents: write

# Kalau run sebelumnya masih jalan (jarang terjadi, tapi jaga-jaga) tidak
# saling tabrakan/dobel push ke notif-state.json.
concurrency:
  group: fleetops-telegram-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      # Path file data sinkron di dalam repo ini. Default SAMA PERSIS dengan
      # default di modal "Hubungkan Sinkronisasi" pada index.html
      # (data/fleetops-data.json) -- cuma perlu diubah lewat repo Variable
      # FLEETOPS_DATA_PATH kalau di aplikasi kamu path-nya sengaja diubah.
      FLEETOPS_DATA_PATH: ${{ vars.FLEETOPS_DATA_PATH || 'data/fleetops-data.json' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cek alert & kirim notifikasi Telegram (kalau ada yang baru)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram-notify.mjs

      - name: Commit balik notif-state.json (kalau ada perubahan)
        run: |
          NOTIF_STATE_PATH="$(dirname "$FLEETOPS_DATA_PATH")/notif-state.json"
          if [ ! -f "$NOTIF_STATE_PATH" ]; then
            echo "Tidak ada notif-state.json yang dihasilkan (data.json mungkin belum ada) -- lewati commit."
            exit 0
          fi
          git config user.name "fleetops-bot"
          git config user.email "fleetops-bot@users.noreply.github.com"
          git add "$NOTIF_STATE_PATH"
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan status notifikasi -- tidak perlu commit."
          else
            git commit -m "chore: update notif-state.json [skip ci]"
            git push
          fi
